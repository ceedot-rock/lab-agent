name: Audited checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run lab20 unit tests
        run: PYTHONPATH=. python3 tests/test_lab20.py

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for committed secrets
        run: |
          set -e
          echo "Scanning for common secret patterns..."
          ! grep -rnE "AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|BEGIN [A-Z ]*PRIVATE KEY|sk_(live|test)_[A-Za-z0-9]+|xox[bap]-[A-Za-z0-9-]+|-----BEGIN" \
            --include="*.py" --include="*.html" --include="*.txt" --include="*.md" --include="*.yml" --exclude="audited-checks.yml" .
          echo "No secrets found."

  server-smoke:
    name: Server smoke test
    runs-on: ubuntu-latest
    needs: [tests, secrets-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Boot server and probe routes
        run: |
          set -e
          export LAB_DEPOSIT_DIR="$(mktemp -d)"
          export LAB_REQUIRE_PAY=0
          export PORT=5057
          python3 server.py & SRV=$!
          trap "kill $SRV 2>/dev/null || true" EXIT
          for i in $(seq 1 20); do curl -sf localhost:5057/healthz && break; sleep 1; done
          curl -sf localhost:5057/healthz | grep -q '"ok": *true'
          curl -sf localhost:5057/healthz | grep -q 'slidphilabs-agent-store'
          curl -sf localhost:5057/receipt.schema.json | grep -q 'schema'
          curl -sf localhost:5057/mcp/tools.json
          echo "server smoke OK"
